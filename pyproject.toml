[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gitswitch"
description = "GUI and MCP server for switching GitHub CLI, Forgejo and Gitea accounts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["github", "gh", "gtk", "mcp"]

[project.scripts]
gitswitch-mcp = "gitswitch.mcp:main"

[project.gui-scripts]
gitswitch = "gitswitch.__main__:main"

[tool.setuptools]
packages = ["gitswitch"]

[tool.setuptools.package-data]
gitswitch = ["sounds/*.wav", "icons/hicolor/scalable/apps/*.svg", "locale/*/LC_MESSAGES/*.mo"]

[tool.setuptools.dynamic]
version = { attr = "gitswitch.__version__" }

[tool.setuptools.data-files]
"share/applications" = ["data/dev.gitswitch.GitSwitch.desktop"]
"share/icons/hicolor/scalable/apps" = ["gitswitch/icons/hicolor/scalable/apps/dev.gitswitch.GitSwitch.svg"]
